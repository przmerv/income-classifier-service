[project]
name = "project-template"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Mervin Perez", email = "perezmervin25@gmail.com" }
]
requires-python = ">=3.14"
dependencies = []

[project.scripts]
project-template = "app:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]   # errors, pyflakes, imports, bugbear, pyupgrade

[tool.mypy]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.build-backend]
module-name = "app"